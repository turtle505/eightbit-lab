<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-bit Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <h1><span class="ico">👾 </span><span class="t-game">8-BIT LAB</span><span class="t-console">8-bit Lab <span class="muted">/ console</span></span><span class="t-reports">8-bit Lab <span class="muted">/ <span data-i18n="h.reports">보고서</span></span></span></h1>
      <div id="stats" class="stats"></div>
      <div id="search-box" class="search-box">
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" />
        <div id="search-panel" class="search-panel" hidden></div>
      </div>
      <button id="notify-btn" hidden data-i18n="notify" data-i18n-title="notify.title" title="완료·승인 요청을 데스크톱 알림으로 받기">알림 켜기</button>
      <button id="lang-btn" type="button" class="lang-btn" title="한국어 / English">EN</button>
      <div class="view-toggle" role="group" data-i18n-aria="view.toggle" aria-label="화면 전환 (단축키 `)">
        <button type="button" data-view="game" aria-pressed="true" data-i18n="view.game">게임</button>
        <button type="button" data-view="console" aria-pressed="false" data-i18n="view.console">콘솔</button>
        <button type="button" data-view="reports" aria-pressed="false"><span data-i18n="view.reports">보고서</span><span id="reports-unread" class="tab-badge" hidden></span></button>
        <button type="button" data-view="projects" aria-pressed="false" data-i18n="view.projects">프로젝트</button>
      </div>
    </header>

    <!-- ===== game view ===== -->
    <main id="view-game" class="layout">
      <section class="left">
        <div id="office" class="office">
          <div id="overlay" class="overlay"></div>
        </div>
        <div data-slot="command"><section id="command" class="panel command"></section></div>
        <div data-slot="approvals"><section id="approvals" class="panel approvals" hidden></section></div>
        <div data-slot="report-feed"><section id="report-feed" class="panel report-feed"></section></div>
        <div data-slot="employee"><section id="employee" class="panel employee"></section></div>
      </section>

      <aside class="right">
        <div data-slot="todos"><section id="todos" class="panel todos" hidden></section></div>
        <section class="panel">
          <h2 data-i18n="board">📋 작업 보드</h2>
          <form id="task-form" class="task-form">
            <input id="task-title" data-i18n-placeholder="task.title.long" placeholder="새 작업 제목 (예: 첨부한 논문 요약)" autocomplete="off" />
            <textarea id="task-detail" rows="2" data-i18n-placeholder="task.detail" placeholder="세부 지시 (선택)"></textarea>
            <div class="row">
              <select id="task-assignee"></select>
              <button type="button" id="task-attach" class="icon-btn attach-btn" data-i18n-title="attach.form" title="파일 첨부 (폼에 끌어다 놓아도 됨)">📎</button>
              <button type="button" id="task-when" class="icon-btn when-btn" data-i18n-title="when.title" title="예약: 정한 시각에 담당 직원이 시작">⏰</button>
              <label class="lock-opt" data-i18n-title="lock.title" title="🔒 승인 받기: 담당 직원이 자동 모드여도 이 작업에서는 화이트리스트 밖 도구마다 매니저 승인을 받음"><input type="checkbox" id="task-lock" /> <span data-i18n="lock.short">🔒 승인</span></label>
              <button class="primary" type="submit" data-i18n="add">추가</button>
            </div>
            <div id="task-when-box" class="when-box" hidden></div>
            <div id="task-chips" class="att-chips" hidden></div>
          </form>
          <div id="board" class="board"></div>
        </section>
        <div data-slot="routines"><section id="routines" class="panel"></section></div>
        <div data-slot="jobs"><section id="jobs" class="panel"></section></div>
      </aside>
    </main>

    <!-- ===== console view ===== -->
    <main id="view-console" class="console" hidden>
      <div data-slot="approvals"></div>
      <div class="c-grid">
        <div class="c-main">
          <section class="panel">
            <div class="c-head"><h2 data-i18n="c.staff">직원</h2><span class="muted small"><kbd>1</kbd>–<kbd>5</kbd> <span data-i18n="k.select">선택</span> · <kbd>j</kbd>/<kbd>k</kbd> <span data-i18n="k.move">이동</span> · <kbd>/</kbd> <span data-i18n="k.instruct">지시</span> · <kbd>Esc</kbd> <span data-i18n="k.clear">해제</span> · <kbd>`</kbd> <span data-i18n="k.view">화면 전환</span></span></div>
            <div id="c-staff"></div>
          </section>
          <div data-slot="command"></div>
          <section class="panel">
            <div class="c-head"><h2 data-i18n="c.tasks">작업</h2></div>
            <form id="c-task-form" class="c-task-form">
              <input id="c-task-title" data-i18n-placeholder="task.title" placeholder="새 작업 제목" autocomplete="off" />
              <input id="c-task-detail" data-i18n-placeholder="task.detail" placeholder="세부 지시 (선택)" autocomplete="off" />
              <select id="c-task-assignee"></select>
              <button type="button" id="c-task-attach" class="attach-btn" data-i18n="attach" data-i18n-title="attach.line" title="파일 첨부 (입력줄에 끌어다 놓아도 됨)">첨부</button>
              <button type="button" id="c-task-when" class="when-btn" data-i18n="when.short" data-i18n-title="when.title" title="예약: 정한 시각에 담당 직원이 시작">예약</button>
              <label class="lock-opt" data-i18n-title="lock.title" title="🔒 승인 받기: 담당 직원이 자동 모드여도 이 작업에서는 화이트리스트 밖 도구마다 매니저 승인을 받음"><input type="checkbox" id="c-task-lock" /> <span data-i18n="lock.long">승인 받기</span></label>
              <button class="primary" type="submit" data-i18n="add">추가</button>
              <div id="c-task-when-box" class="when-box" hidden></div>
              <div id="c-task-chips" class="att-chips" hidden></div>
            </form>
            <div id="c-tasks"></div>
          </section>
          <div data-slot="report-feed"></div>
          <section class="panel">
            <div class="c-head"><h2 data-i18n="c.feed">활동 피드</h2></div>
            <div id="c-feed"></div>
          </section>
        </div>
        <div class="c-side">
          <section id="c-usage" class="panel usage"></section>
          <div data-slot="todos"></div>
          <div data-slot="employee"></div>
          <div data-slot="routines"></div>
          <div data-slot="jobs"></div>
        </div>
      </div>
    </main>

    <!-- ===== reports view ===== -->
    <main id="view-reports" class="reports" hidden></main>
    <main id="view-projects" class="reports" hidden><div id="projects" class="projects"></div></main>

    <div id="toasts" class="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
