# Scheduled routines — send an instruction to an employee at a set time (this machine's local time; only runs while the backend is up)
# schedule: 5-field cron "minute hour day month weekday" (weekday 0=Sun … 6=Sat, 1-5=weekdays)
# This file only seeds routines: the backend imports each id into the DB (data/office.db) once, the first time it sees it.
# Existing installs keep their own (possibly Korean) copies — editing this file does not change a routine that was already
# imported, and a routine deleted in the UI does not come back.
# From then on, add/edit/delete/enable/disable from the UI routine panel or through the assistant (mcp__office__*_routine).
# A new id is imported on the next restart.
# Keep personal routines (personal vault, paths, etc.) in config/routines.local.yaml, which is not committed to git.
routines:
  - id: morning-briefing
    name: Morning briefing
    schedule: "0 9 * * 1-5"
    employee: sec
    enabled: true
    prompt: |
      Prepare the morning briefing.
      1. Use mcp__office__office_status and mcp__office__list_tasks to get the state of staff, the task board, jobs and GPU servers
      2. Use mcp__office__office_activity (hours: 18) to summarise what staff did since yesterday evening
      3. If your prompt says what this team works on ("About this team"), pick up to 5 papers or preprints from the last 1-2 days
         in that field and introduce each in one line (with link). If it doesn't, skip this step.
      4. Save to reports/daily/<today's date>-morning.md
      5. Final reply: 3 key lines + up to 3 "decisions for the manager today". Don't delegate to staff; only suggest.

  - id: evening-report
    name: Evening daily report
    schedule: "0 18 * * 1-5"
    employee: sec
    enabled: true
    prompt: |
      Write today's daily report.
      1. Use mcp__office__office_activity (hours: 12) to summarise each employee's work, outputs and errors today
      2. Use mcp__office__list_tasks to flag tasks awaiting review and tasks that are stuck
      3. Summarise remote job results (done/failed), and for failed jobs estimate the cause with mcp__lab__tail_log
      4. Save to reports/daily/<today's date>-evening.md
      5. Final reply: 3 lines on today's progress, 3 suggestions for what to continue tomorrow

  - id: weekly-review
    name: Weekly review
    schedule: "0 17 * * 5"
    employee: sec
    enabled: false
    prompt: |
      Write this week's review. Based on this week's reports in reports/daily/ and mcp__office__list_tasks,
      save completed work, experiments in progress, blockers and suggested priorities for next week to reports/weekly/<date>.md.
