# 예약 루틴 — 정해진 시간에 직원에게 지시를 보냄 (이 Mac의 현지 시간, 백엔드가 켜져 있을 때만 실행)
# schedule: cron 5필드 "분 시 일 월 요일" (요일 0=일 … 6=토, 1-5=평일)
# UI의 루틴 패널에서 켜기/끄기, "지금 실행" 가능. 파일 수정 후에는 백엔드 재시작.
routines:
  - id: morning-briefing
    name: 아침 브리핑
    schedule: "0 9 * * 1-5"
    employee: sec
    enabled: true
    prompt: |
      아침 브리핑을 준비하세요.
      1. mcp__office__office_status, mcp__office__list_tasks 로 직원·작업 보드·job·GPU 서버 현황을 파악
      2. mcp__office__office_activity (hours: 18) 로 어제 저녁 이후 직원들이 한 일을 요약
      3. bioRxiv에서 최근 1~2일 사이 올라온 프리프린트 중 단백질 구조 표현/예측/생성
         (diffusion, flow matching, equivariant, AlphaFold 계열, protein design) 관련 최대 5편을 골라 한 줄씩 소개 (링크 포함)
      4. reports/daily/<오늘날짜>-morning.md 로 저장
      5. 마지막 답변: 핵심 3줄 + "오늘 매니저가 결정할 일" 최대 3개. 직원에게 위임은 하지 말고 제안만.

  - id: evening-report
    name: 저녁 일일 리포트
    schedule: "0 18 * * 1-5"
    employee: sec
    enabled: true
    prompt: |
      오늘의 일일 리포트를 작성하세요.
      1. mcp__office__office_activity (hours: 12) 로 직원별 오늘 한 일, 산출물, 오류를 정리
      2. mcp__office__list_tasks 로 검토 대기(review) 작업과 막힌 작업을 표시
      3. 원격 job 결과(완료/실패)를 정리하고 실패한 job은 mcp__lab__tail_log 로 원인 추정
      4. reports/daily/<오늘날짜>-evening.md 로 저장
      5. 마지막 답변: 오늘 성과 3줄, 내일 이어서 할 일 제안 3개

  - id: weekly-review
    name: 주간 회고
    schedule: "0 17 * * 5"
    employee: sec
    enabled: false
    prompt: |
      이번 주 회고를 작성하세요. reports/daily/ 의 이번 주 리포트와 mcp__office__list_tasks 를 바탕으로
      완료한 일, 진행 중인 실험, 막힌 점, 다음 주 우선순위 제안을 reports/weekly/<날짜>.md 로 저장하세요.

  - id: obsidian-daily-note
    name: Obsidian 데일리 노트
    schedule: "30 8 * * 1-5"
    employee: sec
    enabled: false
    prompt: |
      anthropic-skills:daily-note 스킬을 사용해 오늘자 데일리 노트를 만들고, 직전 노트의 미완료 항목을 이월하세요.
      그 다음 오늘 사무실 작업 보드의 진행 중 작업 목록을 노트에 덧붙이세요.
