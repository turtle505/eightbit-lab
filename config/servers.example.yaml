# GPU server list. Copy this file to config/servers.local.yaml and fill in real values (it is not committed to git).
# ssh_host should be a Host alias from ~/.ssh/config (key auth; it must connect without a password prompt).
# type:
#   ssh   - run directly (in the background via setsid nohup; GPU status from nvidia-smi)
#   slurm - submit with sbatch; status from squeue/sacct
servers:
  - name: gpu-a
    type: ssh
    ssh_host: gpu-a          # ~/.ssh/config alias
    workdir: ~/office-jobs   # remote folder for job logs/scripts
    setup: |                 # setup commands run before every job
      source ~/miniconda3/etc/profile.d/conda.sh
      conda activate protein

  - name: cluster-b
    type: slurm
    ssh_host: cluster-b-login
    workdir: ~/office-jobs
    setup: |
      module load cuda/12.4
      source ~/miniconda3/etc/profile.d/conda.sh
      conda activate protein
    slurm:
      partition: gpu
      gres: "gpu:1"
      cpus_per_task: 8
      mem: 64G
      time: "24:00:00"
      # account: mylab
      # extra: ["--qos=normal"]

  - name: gpu-c
    type: ssh
    ssh_host: gpu-c
    workdir: /scratch/me/office-jobs
    setup: |
      source ~/miniconda3/etc/profile.d/conda.sh
      conda activate protein
