# Office-wide settings
port: 8787
# Language of the UI and of what agents report in: ko | en.
# Prompts sent to agents are English either way; this only picks the language people read.
# The KO/EN toggle in the header overrides it and is remembered (in the DB).
language: en
# What your team works on, in one line. Every employee's prompt starts with "About this team: <domain>",
# and the morning briefing picks new papers in this field. Empty = no field assumed.
#   domain: "a deep-learning lab working on 3D protein structure"
domain: ""
# Subscription (Pro/Max) rate-limit protection: how many employees may work at the same time
maxConcurrent: 3
# Default employee permission mode (overridden by a role's permissionMode and the UI employee panel toggle)
#   auto: tools the classifier deems safe run right away, only unclear ones ask for approval / ask: every tool outside autoAllow asks for approval
# A task card marked 🔒 (requireApproval) always runs as ask.
permissionMode: auto
# How many ssh/scp runs per minute the office may make to a single host. Shared servers ban clients that connect too often, so keep it low.
# Health checks and GPU polling skip that round when over the limit; opening a session waits until a slot frees up.
sshPerMinute: 5
# For a per-server value, set sshPerMinute on the hosts entry (0 = no limit for that server):
#   - { id: gpu-a, ssh: gpu-a, projectRoot: "~/project", sshPerMinute: 3 }
# How long to keep an employee's session open (minutes). An open session starts the next instruction immediately, and instructions sent mid-work are delivered right away.
# After this long without work it closes, and the next instruction reopens it, resuming the conversation. 0 = never close (keeps using memory).
sessionIdleMinutes: 30
# Default model (roles can override). Empty = Claude Code default.
model: ""
# Research code repo (git) the staff work on. Empty = use ./workspaces/shared.
# Code-editing employees (useWorktree: true) each get a git worktree of this repo.
researchRepo: ""
# Location of worktrees / the shared working folder
workspaceRoot: ./workspaces
# Extra folders the reports tab collects .md files from (default: workspaces/<employee folder>/reports). Personal paths go in office.local.yaml.
# reportDirs: [../research/reports]
# Look for a newer version of 8-bit Lab every 30 minutes (one `git fetch` of this checkout) and show it in the top bar.
# false = never contact the remote by itself; `npm run update` in a terminal still works.
updateCheck: true
# Lab notebook: the office appends a line to workspaces/notebook/<date>.md whenever a task or a GPU job ends, and for every
# "/note …" you type in the command bar. No model is called. It shows in the reports tab and in search. false = keep none.
notebook: true
# Today's to-dos panel: shows the checkboxes of an Obsidian daily note and lets you check/edit/add. Put your personal vault path in office.local.yaml.
# obsidian:
#   vault: /path/to/vault
#   daily: "{YYYY}-{MM}-{DD}.md"          # path inside the vault (default: Obsidian's own). Tokens: {YYYY} {MM} {DD} {ddd}=Mon, Tue, ...
#   sections: []                          # "## " headings to read (substring, any case). Empty = every section; a note without headings is read whole
#   schedule: [Schedule, 일정]             # headings treated as a schedule: plain bullets (appointments) are shown too, not just checkboxes
#   createCommand: ["python3", "scripts/new_daily.py", "{vault}"]   # "create today's note" button: argv, no shell, cwd = vault (hidden if unset)
# Phone / chat notifications while you're away from the office tab (approvals, finished work, GPU jobs, scheduled starts).
# ntfy: install the ntfy app, subscribe to a long random topic, and put its URL here. Anyone who knows the topic
# can read it, so treat the name like a password (or self-host ntfy). Test with: npm run notify:test
# notify:
#   ntfy: https://ntfy.sh/<long-random-topic>
#   webhook: https://hooks.slack.com/services/...      # Slack / Discord incoming webhook (optional)
#   events: [approval, result, error, job, scheduled]  # default: all
#   preview: false                                     # true = add the first ~200 chars of the reply (it leaves this machine)
#   whenAway: true                                     # hold back while an office tab is in front somewhere
# Model servers to use instead of the Claude subscription (linked from roles.yaml with provider: <id>). Only kind: ollama is supported for now.
# Opens an SSH tunnel (localPort) to Ollama on ssh_host (127.0.0.1:remotePort) and runs the Claude Code session over its Anthropic-compatible API.
# Ollama needs a context of 64k or more: OLLAMA_CONTEXT_LENGTH=65536 ollama serve. Put real hosts in office.local.yaml.
# providers:
#   - { id: workstation, name: "🖥 workstation", kind: ollama, ssh_host: workstation, remotePort: 11434, localPort: 11435, model: "qwen3:8b" }
